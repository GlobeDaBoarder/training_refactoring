spring:
  application:
    name: ${APPLICATION_NAME}
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8282/realms/f1-realm
springdoc:
  swagger-ui:
    path: ${SWAGGER_UI_PATH}
  api-docs:
    path: ${API_DOCS_PATH}
